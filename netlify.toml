# Web build for Netlify. Set EXPO_PUBLIC_GOOGLE_MAPS_API_KEY in the site's
# environment variables (it is embedded into the bundle at build time).
[build]
  command = "npx expo export --platform web --clear"
  publish = "dist"

[functions]
  # streets.mts: OpenStreetMap proxy used by the app's street search
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: serve index.html for any path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
